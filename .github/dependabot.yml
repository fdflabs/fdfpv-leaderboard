# Dependabot: one grouped pull request a week per ecosystem, gated by
# checks.yml like every pull request. How the lead merges them, and what is
# left out on purpose (vendor/fdfpv, pinned for deploy-board.sh), is in the
# simulator repository: fdflabs/fdfpv docs/DEPENDENCIES.md.

version: 2
updates:
  # pg and ws: the VM's board. A merged bump reaches it only with the next
  # deploy/vm/deploy-board.sh, run from the simulator repository.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Asuncion
    groups:
      npm:
        patterns: ["*"]
    open-pull-requests-limit: 2
    commit-message:
      prefix: deps
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Asuncion
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 2
    commit-message:
      prefix: deps
