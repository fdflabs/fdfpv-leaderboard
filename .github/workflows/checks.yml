# The board's selftest on every push and pull request. It starts the real
# server on a loopback port with a file store, so it needs nothing but Node.
name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      # The simulator is pinned under vendor/fdfpv: the lap check and the
      # selftest's synthetic laps come from it.
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run lint:licence
      - run: npm run lint:nouns
