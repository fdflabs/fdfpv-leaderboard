services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fdfpv
      POSTGRES_PASSWORD: fdfpv
      POSTGRES_DB: fdfpvboard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  pgdata:
