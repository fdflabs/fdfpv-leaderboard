# A local Postgres for working on the Postgres store:
#   docker compose up -d
#   DATABASE_URL=postgres://fdfpv:fdfpv@127.0.0.1:5432/fdfpvboard npm start
# The board applies schema.sql itself at start; mounting it here as well only
# means a fresh volume has the tables before the first start.

services:
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: fdfpvboard
      POSTGRES_USER: fdfpv
      POSTGRES_PASSWORD: fdfpv
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  pgdata:
