# Render blueprint for the board: one Node web service and one Postgres.
#
# The simulator is a separate repo and a separate blueprint, a static site:
# https://github.com/fdflabs/fdfpv
# Deploy this one first, because the simulator has to be told this URL and
# this service has to be told that one. See DEPLOY.md for the order.
#
# The region is written on both the service and the database and has to
# match. DATABASE_URL below is Render's internal connection string, which
# only resolves between resources in the same region.

services:
  - type: web
    name: fdfpv-board
    runtime: node
    plan: free
    region: singapore

    # ci, not install: package-lock.json is committed, and install is free to
    # quietly resolve a different pg than the one the tests ran against.
    buildCommand: npm ci
    startCommand: npm start

    # The board answers this before the store is touched, so a failing health
    # check means the process is down rather than the database being empty.
    healthCheckPath: /api/health

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fdfpv-board-db
          property: connectionString

      # Where the Fly and Build buttons send people, no trailing slash. Set
      # in the dashboard once the simulator exists. Every consumer treats it
      # as a prefix and concatenates, so it may carry a mount path as well as
      # a host: behind fdfpv.example it is https://fdfpv.example/sim.
      - key: SIM_ORIGIN
        sync: false

      # Public address of THIS service, written into /api/config. Leave unset
      # when the board is the whole site: the request origin plus
      # BOARD_TRUST_PROXY below is then correct. Behind a mount prefix it is
      # not, because a forwarded host cannot carry a path, so set it to
      # https://fdfpv.example/board there. The board's page prefers its own
      # document.baseURI over this either way, so a wrong value here no
      # longer sends a pilot to the landing page; it only makes the JSON lie.
      - key: BOARD_PUBLIC_ORIGIN
        sync: false

      # Render terminates TLS in front of the app, so the request arrives
      # over plain http and only x-forwarded-proto knows it was https.
      # Without this the board writes http:// Fly links, which a browser on
      # an https page refuses as mixed content. The server ignores the
      # header unless this is set, so a directly exposed instance still
      # cannot be told its own scheme by a client.
      - key: BOARD_TRUST_PROXY
        value: "1"

      # Optional. When set, listing and updating tickets needs this token.
      # Testers can still submit without it. Sync it from the Render dashboard.
      - key: BUGS_TOKEN
        sync: false

      # Optional. The browser that published a track can upload that track's
      # card animation with the edit key it already holds, so this is only
      # for the rooms published before animations existed. Sync it from the
      # dashboard, and leave it unset if you do not need it.
      - key: BOARD_ADMIN_TOKEN
        sync: false

      # Who may sign in to the Admin panel on the board's own page. Unset
      # uses the built-in list in src/admin.js, which is one address whose
      # password is published with the source, so set this here. One entry
      # per line or comma separated, each email:scrypt:N:r:p:saltHex:hashHex
      # from `node scripts/admin-hash.js someone@example.com`. Setting it
      # REPLACES the built-in list rather than adding to it.
      - key: BOARD_ADMINS
        sync: false

      # Optional. Mixed into the key that signs admin session tokens, so
      # changing it signs every admin out at once. Leave unset unless that
      # is wanted: changing a password already revokes its own sessions.
      - key: BOARD_SESSION_SECRET
        sync: false

      # Optional. Who gets a sponsor link, slug:Display Name, one per line
      # or comma separated. Unset means no sponsors and every arrival on the
      # statistics tab is Direct or Other. A source this list does not name
      # is folded into Other, so the table cannot be grown by inventing one.
      # Sync it from the dashboard.
      - key: BOARD_SPONSORS
        sync: false

databases:
  - name: fdfpv-board-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"

    # Empty means Render's private network only, which is everything the
    # board needs. Open it in the dashboard, under the database's Access
    # Control, when you want psql from a laptop; the external connection
    # string Render hands you for that is a different one and carries SSL.
    ipAllowList: []
