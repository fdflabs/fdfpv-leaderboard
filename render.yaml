# A Render blueprint for the board on its own: a Node web service and a
# Postgres beside it. The live board runs on the owner's VM instead (the
# simulator's deploy/vm); this stays for anybody who wants the board alone.
#
# The simulator is another repository and another blueprint
# (https://github.com/fdflabs/fdfpv). Each has to be told the other's
# address, so stand this one up first; the simulator's DEPLOY.md has the
# order. The service and the database must share a region, because the
# DATABASE_URL Render fills in only resolves inside one.

services:
  - type: web
    name: fdfpv-board
    runtime: node
    plan: free
    region: singapore
    # From the committed lock file, so the pg that runs is the pg the tests
    # ran against.
    buildCommand: npm ci
    startCommand: npm start
    # Answered without touching the store: a failing check means the process
    # is down, not that the database is empty.
    healthCheckPath: /api/health

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fdfpv-board-db
          property: connectionString

      # The simulator's address, no trailing slash, set once it exists. It is
      # used as a prefix, so it may carry a path (https://fdfpv.example/sim).
      - key: SIM_ORIGIN
        sync: false

      # This service's public address, as /api/config reports it. Leave it
      # unset when the board is the whole site. Behind a path prefix, set it
      # (https://fdfpv.example/board), since a forwarded host has no path.
      # The page uses its own base URL either way; this only keeps the JSON
      # honest.
      - key: BOARD_PUBLIC_ORIGIN
        sync: false

      # Render ends TLS in front of the app, so only x-forwarded-proto says
      # the request was https; without believing it the board would hand out
      # http links an https page refuses. Unset, the headers are ignored, so
      # a bare instance cannot be told its scheme by a client.
      - key: BOARD_TRUST_PROXY
        value: "1"

      # Optional: a token to list and update tickets. Filing one never needs it.
      - key: BUGS_TOKEN
        sync: false

      # Optional: a way past an edit key for scripts (the simulator's
      # boardgif.js uploads card animations for rooms whose publishing
      # browser is gone). A signed in admin needs no token.
      - key: BOARD_ADMIN_TOKEN
        sync: false

      # Who may sign in to the Admin panel: email:scrypt:N:r:p:saltHex:hashHex
      # entries from `node scripts/admin-hash.js someone@example.com`, one per
      # line or comma separated. It is the whole list; nothing ships, so
      # until this is set nobody can sign in.
      - key: BOARD_ADMINS
        sync: false

      # Optional: mixed into the session signing key, so changing it signs
      # every admin out. A changed password already ends its own sessions.
      - key: BOARD_SESSION_SECRET
        sync: false

      # Optional: sponsors as slug:Display Name, one per line or comma
      # separated. Any other source is counted as Other.
      - key: BOARD_SPONSORS
        sync: false

databases:
  - name: fdfpv-board-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    # Private network only, which is all the board needs. Open it under the
    # database's Access Control for psql from a laptop; that external
    # connection string is a different one, with SSL.
    ipAllowList: []
